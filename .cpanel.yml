---
deployment:
  tasks:
    - export DEPLOYPATH=/home/careerca/public_html
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -R * "$DEPLOYPATH/"
    - /bin/rm -rf "$DEPLOYPATH/backups" "$DEPLOYPATH/scripts" "$DEPLOYPATH/node_modules" "$DEPLOYPATH/preview_server.py"
    - /bin/rm -f "$DEPLOYPATH"/*.bak "$DEPLOYPATH"/Screenshot*.png
